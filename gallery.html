<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Gallery — International House Medellín</title>
<meta name="description" content="Photos of International House Medellín: private rooms, rooftop terrace, industrial kitchen and common areas.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syncopate:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--gold:#c8a74f;--main:#ff1100;--header:72px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* Header */
header{position:fixed;inset:0 0 auto 0;height:var(--header);background:#fff;z-index:50;border-top:4px solid #111;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(20px,8vw,120px)}
.burger{width:28px;height:20px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:none;border:0;cursor:pointer}
.burger span{display:block;height:2px;background:#111;transition:.3s}
.burger.x span:nth-child(2){opacity:0}
.logo img{height:44px;width:auto;margin:0 auto}
.hright{justify-self:end;display:flex;gap:26px;align-items:center}
.lang{display:flex;gap:2px;font-size:13px;font-weight:600;letter-spacing:.08em}
.lang button{background:none;border:0;font:inherit;cursor:pointer;color:#999;padding:6px 7px;border-radius:4px}
.lang button.on{color:#111}
.hright svg{width:22px;height:22px;fill:#111}

/* Menu */
.menu{position:fixed;inset:0;background:#fff;z-index:40;display:flex;flex-direction:column;justify-content:center;
  padding:0 clamp(24px,10vw,160px);transform:translateY(-100%);transition:transform .6s cubic-bezier(.7,0,.2,1)}
.menu.open{transform:none}
.menu a{font-size:clamp(34px,6vw,76px);font-weight:600;letter-spacing:-.02em;line-height:1.25;transition:.2s}
.menu a:hover{color:var(--gold);padding-left:12px}
.menu small{margin-top:40px;font-size:13px;letter-spacing:.14em;color:#777}
body.lock{overflow:hidden}

/* Stacked hero panels */
html{scroll-snap-type:y proximity}
.panel{position:relative;height:100vh;min-height:620px;display:flex;align-items:flex-end;justify-content:center;text-align:center;color:#fff;overflow:hidden;scroll-snap-align:start}
.panel .bg{position:absolute;inset:0;background:var(--img) center/cover;transform:scale(1.08);transition:transform 2.2s cubic-bezier(.2,.7,.2,1)}
.panel.in .bg{transform:scale(1)}
.panel::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,10,24,.8),rgba(8,10,24,.45) 45%,rgba(8,10,24,.25))}
.panel .copy{position:relative;z-index:2;padding:0 24px 15vh;max-width:1100px;opacity:0;transform:translateY(30px);transition:1.1s .25s;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.panel.in .copy{opacity:1;transform:none}
.eyebrow{font-family:Syncopate,sans-serif;font-size:clamp(11px,1.15vw,15px);letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px}
.panel h1,.panel h2{font-size:clamp(42px,8.2vw,128px);font-weight:700;letter-spacing:-.04em;line-height:1}
.sub{margin:18px auto 0;max-width:620px;font-size:clamp(15px,1.4vw,19px);line-height:1.5}
.pill{display:inline-block;margin-top:34px;padding:19px 44px;border-radius:999px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:18px;transition:.25s;text-shadow:none}
.pill:hover{background:#fff;color:#111}
.chev{position:absolute;bottom:34px;left:50%;margin-left:-13px;z-index:3;width:26px;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.dots{position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:14px;transition:opacity .3s}
.dots a{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.5;border:1px solid rgba(0,0,0,.25);transition:.3s}
.dots a.on{opacity:1;transform:scale(1.5)}


/* Gallery hero */
.ghero{position:relative;height:56vh;min-height:380px;display:flex;align-items:flex-end;justify-content:center;text-align:center;color:#fff;overflow:hidden;padding-top:var(--header)}
.ghero::before{content:"";position:absolute;inset:0;background:url(img/RoofTop-2s-scaled-1.jpg) center/cover;transform:scale(1.08);animation:zoomin 2.4s cubic-bezier(.2,.7,.2,1) forwards}
.ghero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,10,24,.8),rgba(8,10,24,.4) 55%,rgba(8,10,24,.3))}
@keyframes zoomin{to{transform:scale(1)}}
.ghero .copy{position:relative;z-index:2;padding:0 24px 8vh;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.eyebrow{font-family:Syncopate,sans-serif;font-size:clamp(11px,1.15vw,15px);letter-spacing:.2em;text-transform:uppercase;margin-bottom:16px}
.ghero h1{font-size:clamp(42px,8vw,120px);font-weight:700;letter-spacing:-.04em;line-height:1}
.ghero p{margin:16px auto 0;max-width:560px;font-size:clamp(15px,1.4vw,19px);line-height:1.5}

/* Grid */
.gallery{padding:clamp(48px,7vw,100px) clamp(16px,6vw,100px) clamp(70px,9vw,130px);background:#fff;min-height:60vh}
.gwrap{max-width:1360px;margin:0 auto}
.gtop{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:12px;margin-bottom:28px;font-size:14px;color:#777;letter-spacing:.04em}
.gtop b{color:#111;font-weight:600}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.gi{position:relative;aspect-ratio:4/3;overflow:hidden;border:0;padding:0;background:#eee;cursor:zoom-in;border-radius:4px;display:block}
.gi img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .6s;opacity:0}
.gi img.ld{opacity:1}
.gi:hover img{transform:scale(1.07)}
.gi::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.35),transparent 45%);opacity:0;transition:.3s}
.gi:hover::after{opacity:1}
.gi.in{animation:gin .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes gin{from{opacity:0;transform:translateY(22px)}}
.gi:focus-visible{outline:3px solid var(--main);outline-offset:2px}

/* Pagination */
.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:56px;flex-wrap:wrap}
.pager button{min-width:46px;height:46px;padding:0 16px;border-radius:999px;border:1px solid #ddd;background:#fff;font:600 15px Inter,sans-serif;color:#111;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.pager button:hover:not(:disabled):not(.on){border-color:var(--gold);color:var(--gold)}
.pager button.on{background:var(--main);border-color:var(--main);color:#fff}
.pager button:disabled{opacity:.35;cursor:default}
.pager svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.pinfo{text-align:center;margin-top:18px;font-size:13px;color:#888;letter-spacing:.08em}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,10,24,.94);display:none;align-items:center;justify-content:center;padding:70px 72px}
.lb.open{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 30px 90px rgba(0,0,0,.6);user-select:none}
.lb button{position:absolute;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:grid;place-items:center;transition:.2s;width:52px;height:52px}
.lb button:hover{background:var(--main)}
.lb svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.lb .x{top:18px;right:22px}.lb .pv{left:18px;top:50%;margin-top:-26px}.lb .nx{right:18px;top:50%;margin-top:-26px}
.lb .ct{position:absolute;top:30px;left:50%;transform:translateX(-50%);color:#ddd;font-size:14px;letter-spacing:.14em}
footer{padding:50px clamp(20px,8vw,120px);border-top:1px solid #e5e5e5;display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;font-size:13px;color:#777}
@media (max-width:980px){.ggrid{grid-template-columns:repeat(2,1fr)}.lb{padding:70px 16px}}
@media (max-width:560px){.ggrid{grid-template-columns:1fr;gap:10px}.lb .pv,.lb .nx{top:auto;bottom:18px;margin:0}.lb .pv{left:calc(50% - 64px)}.lb .nx{right:calc(50% - 64px)}.hright{gap:16px}.lb{padding:64px 12px 84px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  <a class="logo" href="index.html"><img src="img/logo-ih.png" alt="International House Medellín"></a>
  <div class="hright">
    <div class="lang"><button data-lang="en">EN</button><button data-lang="es">ES</button></div>
    <a href="index.html#contact" aria-label="Location"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg></a>
    <a href="https://wa.me/573012114380" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg></a>
  </div>
</header>

<nav class="menu" id="menu">
  <a href="index.html" data-i18n="m1"></a>
  <a href="index.html#rooms" data-i18n="m2"></a>
  <a href="index.html#amenities" data-i18n="m3"></a>
  <a href="gallery.html" data-i18n="m6"></a>
  <a href="index.html#about" data-i18n="m4"></a>
  <a href="index.html#contact" data-i18n="m5"></a>
  <small>CALLE 32B #66C-06 · BELÉN ROSALES · MEDELLÍN</small>
</nav>

<section class="ghero">
  <div class="copy">
    <div class="eyebrow" data-i18n="g_e"></div>
    <h1 data-i18n="g_h"></h1>
    <p data-i18n="g_p"></p>
  </div>
</section>

<main class="gallery">
  <div class="gwrap">
    <div class="gtop"><span id="gcount"></span><span id="gpage"></span></div>
    <div class="ggrid" id="ggrid"></div>
    <nav class="pager" id="pager" aria-label="Pagination"></nav>
  </div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="ct" id="lbct"></div>
  <button class="x" id="lbx" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <button class="pv" id="lbp" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
  <button class="nx" id="lbn" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
  <img id="lbi" alt="">
</div>

<footer>
  <span data-i18n="f1"></span>
  <span>Facebook · Twitter</span>
</footer>

<script>
const IMGS=["g01.jpg","g02.jpg","g03.jpg","g04.jpg","g05.jpg","g06.jpg","g07.jpg","g08.jpg","g09.jpg","g10.jpg","g11.jpg","g12.jpg","g13.jpg","g14.jpg","g15.jpg","g16.jpg","g17.jpg","g18.jpg","g19.jpg","g20.jpg","g21.jpg","g22.jpg","g23.jpg","g24.jpg","g25.jpg","g26.jpg","g27.jpg","g28.jpg","g29.jpg","g30.jpg","g31.jpg","g32.jpg","g33.jpg","g34.jpg","g35.jpg","g36.jpg","g37.jpg","g38.jpg","g39.jpg","g40.jpg","g41.jpg","g42.jpg","g43.jpg","g44.jpg","g45.jpg","g46.jpg","g47.jpg","g48.jpg","g49.jpg","g50.jpg","g51.jpg","g52.jpg","g53.jpg","g54.jpg","g55.jpg","g56.jpg","g57.jpg","g58.jpg","g59.jpg","g60.jpg","g61.jpg","g62.jpg","g63.jpg","g64.jpg","g65.jpg","g66.jpg","g67.jpg","g68.jpg","g69.jpg","g70.jpg","g71.jpg","g72.jpg","g73.jpg","g74.jpg","g75.jpg","g76.jpg","g77.jpg","g78.jpg","g79.jpg"];
const PER=30,PAGES=Math.ceil(IMGS.length/PER);
const T={
en:{m1:"Home",m2:"Private Rooms",m3:"Amenities",m6:"Gallery",m4:"About Us",m5:"Contact",
g_e:"Photo Gallery",g_h:"Life at International House",g_p:"Our rooms, rooftop, kitchen and common areas.",
photos:"photos",page:"Page",of:"of",prev:"Previous",next:"Next",alt:"International House Medellín photo",
f1:"© 2026 International House Medellín. All rights reserved."},
es:{m1:"Inicio",m2:"Habitaciones Privadas",m3:"Servicios",m6:"Galería",m4:"Nosotros",m5:"Contacto",
g_e:"Galería de Fotos",g_h:"La vida en International House",g_p:"Nuestras habitaciones, terraza, cocina y zonas comunes.",
photos:"fotos",page:"Página",of:"de",prev:"Anterior",next:"Siguiente",alt:"Foto de International House Medellín",
f1:"© 2026 International House Medellín. Todos los derechos reservados."}};
const TITLE={en:"Photo Gallery — International House Medellín",es:"Galería de Fotos — International House Medellín"};
let LANG='en',cur=1;
function setLang(l){
  LANG=l;document.documentElement.lang=l;document.title=TITLE[l];
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T[l][el.dataset.i18n]);
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  try{localStorage.setItem('ih-lang',l)}catch(e){}
  renderMeta();renderPager();
}
let saved=null;try{saved=localStorage.getItem('ih-lang')}catch(e){}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

// menu
const burger=document.getElementById('burger'),menu=document.getElementById('menu');
function toggle(open){menu.classList.toggle('open',open);document.body.classList.toggle('lock',open);
  burger.classList.toggle('x',open);
  const s=burger.querySelectorAll('span');
  s[0].style.transform=open?'translateY(7px) rotate(45deg)':'';s[2].style.transform=open?'translateY(-7px) rotate(-45deg)':'';}
burger.onclick=()=>toggle(!menu.classList.contains('open'));
menu.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>toggle(false)));

// grid + pagination
const grid=document.getElementById('ggrid'),pager=document.getElementById('pager');
const chev=d=>'<svg viewBox="0 0 24 24"><path d="'+(d<0?'M15 4l-8 8 8 8':'M9 4l8 8-8 8')+'"/></svg>';
function pageItems(p){return IMGS.slice((p-1)*PER,p*PER)}
function renderMeta(){
  document.getElementById('gcount').innerHTML='<b>'+IMGS.length+'</b> '+T[LANG].photos;
  document.getElementById('gpage').textContent=T[LANG].page+' '+cur+' '+T[LANG].of+' '+PAGES;
}
function renderGrid(){
  const items=pageItems(cur);
  grid.innerHTML=items.map((f,i)=>'<button class="gi in" style="animation-delay:'+Math.min(i,12)*40+'ms" data-i="'+i+'"><img src="gallery/thumbs/'+f+'" alt="'+T[LANG].alt+' '+((cur-1)*PER+i+1)+'" loading="lazy" decoding="async"></button>').join('');
  grid.querySelectorAll('img').forEach(im=>{if(im.complete)im.classList.add('ld');else im.addEventListener('load',()=>im.classList.add('ld'))});
}
function renderPager(){
  let h='<button data-p="'+(cur-1)+'"'+(cur===1?' disabled':'')+' aria-label="'+T[LANG].prev+'">'+chev(-1)+'<span class="pl">'+T[LANG].prev+'</span></button>';
  for(let p=1;p<=PAGES;p++)h+='<button data-p="'+p+'"'+(p===cur?' class="on" aria-current="page"':'')+'>'+p+'</button>';
  h+='<button data-p="'+(cur+1)+'"'+(cur===PAGES?' disabled':'')+' aria-label="'+T[LANG].next+'"><span class="pl">'+T[LANG].next+'</span>'+chev(1)+'</button>';
  pager.innerHTML=h;
}
function go(p,push,scroll){
  p=Math.min(PAGES,Math.max(1,p));cur=p;
  renderGrid();renderMeta();renderPager();
  if(push){const u=new URL(location);u.searchParams.set('page',p);if(p===1)u.searchParams.delete('page');history.pushState({p},'',u)}
  if(scroll)document.querySelector('.gallery').scrollIntoView({behavior:'smooth',block:'start'});
}
pager.addEventListener('click',e=>{const b=e.target.closest('button[data-p]');if(!b||b.disabled)return;go(+b.dataset.p,true,true)});
addEventListener('popstate',()=>go(+(new URL(location).searchParams.get('page'))||1,false,false));

// lightbox (cycles through the current page)
const lb=document.getElementById('lb'),lbi=document.getElementById('lbi'),lbct=document.getElementById('lbct');
let li=0;
function show(i){const it=pageItems(cur);li=(i+it.length)%it.length;lbi.src='gallery/'+it[li];lbct.textContent=(li+1)+' / '+it.length;
  const nx=new Image();nx.src='gallery/'+it[(li+1)%it.length]}
function openLb(i){show(i);lb.classList.add('open');lb.setAttribute('aria-hidden','false');document.body.classList.add('lock')}
function closeLb(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');document.body.classList.remove('lock')}
grid.addEventListener('click',e=>{const b=e.target.closest('.gi');if(b)openLb(+b.dataset.i)});
document.getElementById('lbx').onclick=closeLb;
document.getElementById('lbp').onclick=()=>show(li-1);
document.getElementById('lbn').onclick=()=>show(li+1);
lb.addEventListener('click',e=>{if(e.target===lb)closeLb()});
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')show(li+1);if(e.key==='ArrowLeft')show(li-1)});
let x0=null;lb.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
lb.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)show(li+(d<0?1:-1));x0=null});

cur=Math.min(PAGES,Math.max(1,+(new URL(location).searchParams.get('page'))||1));
setLang(saved||((navigator.language||'').toLowerCase().startsWith('es')?'es':'en'));
renderGrid();
</script>
</body>
</html>
