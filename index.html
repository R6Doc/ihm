<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International House Medellín — Co-Living</title>
<meta name="description" content="The first co-living in Medellín. 20 private rooms, 900 Mbps WiFi, rooftop kitchen and a 360° view of the city.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syncopate:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--gold:#c8a74f;--main:#ff1100;--header:72px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* Header */
header{position:fixed;inset:0 0 auto 0;height:var(--header);background:#fff;z-index:50;border-top:4px solid #111;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(20px,8vw,120px)}
.burger{width:28px;height:20px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:none;border:0;cursor:pointer}
.burger span{display:block;height:2px;background:#111;transition:.3s}
.burger.x span:nth-child(2){opacity:0}
.logo img{height:44px;width:auto;margin:0 auto}
.hright{justify-self:end;display:flex;gap:26px;align-items:center}
.lang{display:flex;gap:2px;font-size:13px;font-weight:600;letter-spacing:.08em}
.lang button{background:none;border:0;font:inherit;cursor:pointer;color:#999;padding:6px 7px;border-radius:4px}
.lang button.on{color:#111}
.hright svg{width:22px;height:22px;fill:#111}

/* Menu */
.menu{position:fixed;inset:0;background:#fff;z-index:40;display:flex;flex-direction:column;justify-content:center;
  padding:0 clamp(24px,10vw,160px);transform:translateY(-100%);transition:transform .6s cubic-bezier(.7,0,.2,1)}
.menu.open{transform:none}
.menu a{font-size:clamp(34px,6vw,76px);font-weight:600;letter-spacing:-.02em;line-height:1.25;transition:.2s}
.menu a:hover{color:var(--gold);padding-left:12px}
.menu small{margin-top:40px;font-size:13px;letter-spacing:.14em;color:#777}
body.lock{overflow:hidden}

/* Stacked hero panels */
html{scroll-snap-type:y proximity}
.panel{position:relative;height:100vh;min-height:620px;display:flex;align-items:flex-end;justify-content:center;text-align:center;color:#fff;overflow:hidden;scroll-snap-align:start}
.panel .bg{position:absolute;inset:0;background:var(--img) center/cover;transform:scale(1.08);transition:transform 2.2s cubic-bezier(.2,.7,.2,1)}
.panel.in .bg{transform:scale(1)}
.panel::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,10,24,.8),rgba(8,10,24,.45) 45%,rgba(8,10,24,.25))}
.panel .copy{position:relative;z-index:2;padding:0 24px 15vh;max-width:1100px;opacity:0;transform:translateY(30px);transition:1.1s .25s;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.panel.in .copy{opacity:1;transform:none}
.eyebrow{font-family:Syncopate,sans-serif;font-size:clamp(11px,1.15vw,15px);letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px}
.panel h1,.panel h2{font-size:clamp(42px,8.2vw,128px);font-weight:700;letter-spacing:-.04em;line-height:1}
.sub{margin:18px auto 0;max-width:620px;font-size:clamp(15px,1.4vw,19px);line-height:1.5}
.pill{display:inline-block;margin-top:34px;padding:19px 44px;border-radius:999px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:18px;transition:.25s;text-shadow:none}
.pill:hover{background:#fff;color:#111}
.chev{position:absolute;bottom:34px;left:50%;margin-left:-13px;z-index:3;width:26px;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(8px)}}
.dots{position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:30;display:flex;flex-direction:column;gap:14px;transition:opacity .3s}
.dots a{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.5;border:1px solid rgba(0,0,0,.25);transition:.3s}
.dots a.on{opacity:1;transform:scale(1.5)}

/* Hero carousel */
.hero{scroll-snap-align:start;position:relative;height:100vh;min-height:620px;overflow:hidden;color:#fff;text-align:center;background:#222;padding-top:var(--header)}
.slide{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity 1.2s ease,visibility 1.2s}
.slide.on{opacity:1;visibility:visible}
.slide::before{content:"";position:absolute;inset:0;background:var(--img) center/cover;transform:scale(1.1);transition:transform 6s linear}
.slide.on::before{transform:scale(1)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,10,24,.8) 0%,rgba(8,10,24,.48) 45%,rgba(8,10,24,.28) 100%)}
.slide .copy{position:relative;z-index:2;padding:0 24px calc(17vh + 130px);max-width:1100px;opacity:0;transform:translateY(30px);transition:1s .5s;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.slide.on .copy{opacity:1;transform:none}
.eyebrow{font-family:Syncopate,sans-serif;font-size:clamp(11px,1.15vw,15px);letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px}
.hero h1,.hero h2{font-size:clamp(42px,8.2vw,128px);font-weight:700;letter-spacing:-.04em;line-height:1}
.sub{margin:18px auto 0;max-width:620px;font-size:clamp(15px,1.4vw,19px);line-height:1.5}
.pill{display:inline-block;margin-top:34px;padding:19px 44px;border-radius:999px;background:rgba(255,255,255,.22);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:18px;transition:.25s;text-shadow:none}
.pill:hover{background:#fff;color:#111}
.bars{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:10px}
.bars i{display:block;width:clamp(36px,6vw,64px);height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden;cursor:pointer;position:relative;padding:8px 0;background-clip:content-box}
.bars i::after{content:"";position:absolute;left:0;right:0;top:8px;height:3px;background:#fff;transform:scaleX(0);transform-origin:left}
.bars i.done::after{transform:scaleX(1)}
.bars i.on::after{animation:fill var(--dur,6s) linear forwards}
.hero.paused .bars i.on::after{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
.chev{position:absolute;bottom:62px;left:50%;margin-left:-13px;z-index:5;width:26px;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(8px)}}


/* Booking module */
.book{position:absolute;left:50%;transform:translateX(-50%);bottom:17vh;width:min(860px,calc(100% - 40px));z-index:6;display:flex;align-items:stretch;background:#fff;color:#111;border-radius:16px;text-shadow:none;text-align:left;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.book .f{flex:1;display:flex;flex-direction:column;justify-content:center;padding:14px 22px;border-right:1px solid #e6e6e6;position:relative;min-width:0;cursor:pointer}
.book .f>span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#777;margin-bottom:4px}
.book input{border:0;outline:0;background:none;font:600 16px Inter,sans-serif;color:#111;width:100%;cursor:pointer;padding:0}
.book input::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6}
.book .guests button#gBtn{background:none;border:0;font:600 16px Inter,sans-serif;text-align:left;cursor:pointer;padding:0;color:#111}
.book .go{background:var(--main);color:#fff;border:0;font:600 17px Inter,sans-serif;padding:0 36px;cursor:pointer;border-radius:0 16px 16px 0;transition:.25s}
.book .go:hover{background:#111}
.gpop{position:absolute;top:calc(100% + 10px);left:0;min-width:260px;background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 16px 40px rgba(0,0,0,.28);display:none;z-index:10}
.gpop.open{display:block}
.gpop .row{display:flex;align-items:center;justify-content:space-between;gap:20px}
.step{display:flex;align-items:center;gap:14px}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid #bbb;background:#fff;font-size:20px;line-height:1;cursor:pointer;color:#111}
.step button:hover{border-color:var(--main);color:var(--main)}
.step output{min-width:18px;text-align:center;font-weight:600}
@media (max-height:760px) and (min-width:761px){.slide .copy{padding-bottom:calc(14vh + 120px)}.book{bottom:14vh}}
@media (max-width:760px){
  .book{flex-direction:column;width:min(420px,calc(100% - 40px));bottom:64px}
  .book .f{border-right:0;border-bottom:1px solid #e6e6e6;padding:12px 18px}
  .book .go{padding:17px;border-radius:0 0 16px 16px}
  .slide .copy{padding-bottom:340px}
  .slide .sub{display:none}
}


.book .val{background:none;border:0;font:600 16px Inter,sans-serif;text-align:left;cursor:pointer;padding:0;color:#111;width:100%}
.book .f.active>span{color:var(--main)}
.book .f.active::after{content:"";position:absolute;left:22px;right:22px;bottom:8px;height:2px;background:var(--main);border-radius:2px}
.cal{position:absolute;bottom:calc(100% + 12px);left:0;background:#fff;border-radius:18px;padding:26px 28px 20px;box-shadow:0 24px 70px rgba(0,0,0,.4);display:none;z-index:12;color:#111;cursor:default}
.cal.open{display:block;animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
.cal .months{display:flex;gap:44px}
.cal .mo{width:294px}
.cal .mh{height:40px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;text-transform:capitalize;letter-spacing:-.01em;position:relative}
.cal .nav{position:absolute;top:0;width:36px;height:36px;border-radius:50%;border:1px solid #ddd;background:#fff;cursor:pointer;display:grid;place-items:center;transition:.2s}
.cal .nav:hover:not(:disabled){border-color:var(--main);color:var(--main)}
.cal .nav:disabled{opacity:.3;cursor:default}
.cal .nav svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5}
.cal .prev{left:0}.cal .next{right:0}
.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;margin-top:10px}
.cal .wd{text-align:center;font-size:11px;font-weight:600;letter-spacing:.1em;color:#888;padding:6px 0 10px;text-transform:uppercase}
.cal .d{position:relative;height:42px;border:0;background:none;font:500 15px Inter,sans-serif;color:#111;cursor:pointer;z-index:0}
.cal .d::before{content:"";position:absolute;inset:0;z-index:-1}
.cal .d.rng::before{background:rgba(255,17,0,.09)}
.cal .d.s::before{background:rgba(255,17,0,.09);left:50%}
.cal .d.e::before{background:rgba(255,17,0,.09);right:50%}
.cal .d.s.e::before{display:none}
.cal .d span{position:relative;display:grid;place-items:center;width:40px;height:40px;margin:1px auto;border-radius:50%;transition:.15s}
.cal .d:hover:not(:disabled):not(.s):not(.e) span{box-shadow:inset 0 0 0 1.5px var(--main)}
.cal .d.s span,.cal .d.e span{background:var(--main);color:#fff;font-weight:700}
.cal .d.t span::after{content:"";position:absolute;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--gold)}
.cal .d.s.t span::after,.cal .d.e.t span::after{background:#fff}
.cal .d:disabled{color:#c9c9c9;cursor:default}
.cal .d.blank{visibility:hidden}
.cal .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:14px;border-top:1px solid #eee;font-size:14px;color:#666}
.cal .foot b{color:#111}
.cal .foot i{font-style:normal;color:var(--gold);font-weight:600}
@media (max-width:980px){.cal{left:50%;transform:translateX(-50%)}.cal.open{animation:none}}
@media (max-width:760px){.cal{width:calc(100vw - 40px);max-width:360px;padding:20px 16px 14px}.cal .months{display:block}.cal .mo{width:100%}}

/* Light sections */
.light{padding:clamp(80px,12vw,180px) clamp(20px,8vw,120px);background:#fff}
.light.alt{background:#f6f5f2}
.wrap{max-width:1240px;margin:0 auto}
.kicker{font-family:Syncopate,sans-serif;font-size:12px;letter-spacing:.22em;color:var(--main);text-transform:uppercase;margin-bottom:22px}
.big{font-size:clamp(34px,5vw,72px);font-weight:700;letter-spacing:-.035em;line-height:1.05;max-width:900px}
.lead{margin-top:28px;font-size:clamp(16px,1.5vw,20px);line-height:1.65;color:#444;max-width:720px}
.reveal{opacity:0;transform:translateY(34px);transition:.9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#ddd;margin-top:80px;border:1px solid #ddd}
.stat{background:#fff;padding:40px 28px}
.stat b{display:block;font-size:clamp(36px,4.4vw,64px);letter-spacing:-.04em;font-weight:700}
.stat span{font-size:14px;color:#666;letter-spacing:.04em}
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:70px}
.room{background:#fff;border-radius:6px;overflow:hidden}
.room .ph{aspect-ratio:4/3;overflow:hidden}
.room .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.room:hover .ph img{transform:scale(1.07)}
.room .in{padding:26px}
.room h3{font-size:20px;letter-spacing:-.01em}
.room .price{margin-top:14px;font-size:28px;font-weight:700;letter-spacing:-.03em}
.room .price small{font-size:13px;font-weight:500;color:#777;letter-spacing:0}
.room p{margin-top:10px;font-size:14px;color:#666;line-height:1.5}
.nightly{margin-top:36px;padding:28px 32px;border:1px solid #ddd;border-radius:6px;display:flex;gap:40px;flex-wrap:wrap;background:#fff}
.nightly div{font-size:15px;color:#555}.nightly b{display:block;font-size:22px;color:#111;margin-top:4px}
.amen{display:grid;grid-template-columns:repeat(3,1fr);margin-top:70px;border-top:1px solid #ddd}
.amen div{padding:34px 30px 34px 0;border-bottom:1px solid #ddd;font-size:17px;line-height:1.5}
.amen b{display:block;font-size:12px;letter-spacing:.2em;color:var(--main);margin-bottom:10px;font-family:Syncopate,sans-serif}
.quotes{background:#111;color:#fff}
.quotes .kicker{color:var(--gold)}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:70px}
.qgrid blockquote{font-size:clamp(16px,1.35vw,19px);line-height:1.65;color:#ddd}
.qgrid cite{display:block;margin-top:22px;font-style:normal;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center}
.map{border-radius:10px;overflow:hidden;aspect-ratio:4/3;width:100%;background:#eee;box-shadow:0 20px 50px rgba(0,0,0,.12)}
.map iframe{width:100%;height:100%;border:0;display:block}
.btn{display:inline-block;margin-top:34px;padding:19px 44px;border-radius:999px;background:#111;color:#fff;font-weight:600;font-size:17px;transition:.25s}
.btn:hover{background:var(--main)}
.btn.ghost{background:none;color:#111;border:1px solid #111;margin-left:12px}
.btn.ghost:hover{background:#111;color:#fff}
footer{padding:50px clamp(20px,8vw,120px);border-top:1px solid #e5e5e5;display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;font-size:13px;color:#777}

@media (max-width:980px){.stats,.rooms,.amen,.qgrid{grid-template-columns:1fr 1fr}.contact{grid-template-columns:1fr}}
@media (max-width:980px){.dots{display:none}}
@media (max-width:600px){.stats,.rooms,.amen,.qgrid{grid-template-columns:1fr}.btn.ghost{margin:14px 0 0}.hright{gap:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  <a class="logo" href="#top"><img src="img/logo-ih.png" alt="International House Medellín"></a>
  <div class="hright">
    <div class="lang"><button data-lang="en">EN</button><button data-lang="es">ES</button></div>
    <a href="#contact" aria-label="Location"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg></a>

  </div>
</header>

<nav class="menu" id="menu">
  <a href="#top" data-i18n="m1"></a>
  <a href="#rooms" data-i18n="m2"></a>
  <a href="#amenities" data-i18n="m3"></a>
  <a href="#about" data-i18n="m4"></a>
  <a href="#contact" data-i18n="m5"></a>
  <small>CALLE 32B #66C-06 · BELÉN ROSALES · MEDELLÍN</small>
</nav>

<div class="dots" id="dots"><a href="#top"></a><a href="#p2"></a><a href="#p3"></a><a href="#p4"></a></div>
<section class="hero" id="top">
  <div class="slides">
    <div class="slide on" style="--img:url(img/5s-scaled-1.jpg)"><div class="copy">
      <div class="eyebrow" data-i18n="s1e"></div><h1 data-i18n="s1t"></h1><p class="sub" data-i18n="s1p"></p>
</div></div>
    <div class="slide" style="--img:url(img/best-hostel-in-medellin-2-1.jpg)"><div class="copy">
      <div class="eyebrow" data-i18n="s4e"></div><h2 data-i18n="s4t"></h2><p class="sub" data-i18n="s4p"></p></div></div>
  </div>
  <form class="book" id="book" autocomplete="off">
        <div class="f dt" data-p="in"><span data-i18n="bk_in"></span><button type="button" class="val" id="bIn"></button></div>
        <div class="f dt" data-p="out"><span data-i18n="bk_out"></span><button type="button" class="val" id="bOut"></button></div>
        <div class="f guests"><span data-i18n="bk_g"></span>
          <button type="button" class="val" id="gBtn" aria-expanded="false"></button>
          <div class="gpop" id="gPop">
            <div class="row"><b data-i18n="bk_adults"></b><div class="step"><button type="button" data-d="-1" aria-label="-">−</button><output id="gVal">2</output><button type="button" data-d="1" aria-label="+">+</button></div></div>
          </div></div>
        <div class="cal" id="cal"></div>
        <button class="go" type="submit" data-i18n="bk_s"></button>
      </form>
  <div class="bars" id="bars"><i></i><i></i></div>
  <a class="chev" href="#p2" aria-label="Scroll"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M4 8l8 8 8-8"/></svg></a>
</section>

<section class="panel" id="p2">
  <div class="bg" style="--img:url(img/RoofTop-2s-scaled-1.jpg)"></div>
  <div class="copy"><div class="eyebrow" data-i18n="s2e"></div><h2 data-i18n="s2t"></h2><p class="sub" data-i18n="s2p"></p>
  <a class="pill" href="#amenities" data-i18n="more"></a></div>
  
</section>
<section class="panel" id="p3">
  <div class="bg" style="--img:url(img/Kitchen-1s-scaled-1.jpg)"></div>
  <div class="copy"><div class="eyebrow" data-i18n="s3e"></div><h2 data-i18n="s3t"></h2><p class="sub" data-i18n="s3p"></p>
  <a class="pill" href="#about" data-i18n="more"></a></div>
  
</section>
<section class="panel" id="p4">

(function(){
  const hero=document.querySelector('.hero'),slides=[...hero.querySelectorAll('.slide')],bars=[...hero.querySelectorAll('.bars i')];
  const DUR=4500;let cur=0,timer;
  hero.style.setProperty('--dur',DUR+'ms');
  function go(n){
    cur=(n+slides.length)%slides.length;
    slides.forEach((s,i)=>s.classList.toggle('on',i===cur));
    bars.forEach((b,i)=>{b.classList.remove('on','done');void b.offsetWidth;if(i<cur)b.classList.add('done');if(i===cur)b.classList.add('on')});
    clearTimeout(timer);timer=setTimeout(()=>go(cur+1),DUR);
    hero.classList.remove('paused');
  }
  bars.forEach((b,i)=>b.onclick=()=>go(i));
  const bk=document.getElementById('book');
  bk.addEventListener('focusin',()=>{clearTimeout(timer);hero.classList.add('paused')});
  bk.addEventListener('click',()=>{clearTimeout(timer);hero.classList.add('paused')});
  // swipe
  let x0=null;
  hero.addEventListener('touchstart',e=>{x0=e.target.closest('.book')?null:e.touches[0].clientX},{passive:true});
  hero.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)go(cur+(d<0?1:-1));x0=null});
  // keyboard
  addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
  // pause when off-screen
  new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){go(cur)}else{clearTimeout(timer)}})},{threshold:.3}).observe(hero);
})();

(function(){
  const $=id=>document.getElementById(id),bIn=$('bIn'),bOut=$('bOut'),btn=$('gBtn'),pop=$('gPop'),val=$('gVal'),cal=$('cal'),book=$('book');

  const today=noon(new Date());let inD=today,outD=add(today,3),phase='in',view=new Date(today.getFullYear(),today.getMonth(),1),n=2;
  const L=()=>document.documentElement.lang,fmt=(d,o)=>d.toLocaleDateString(L()==='es'?'es-CO':'en-US',o);
  const short=d=>fmt(d,{weekday:'short',day:'numeric',month:'short'});
  const nights=()=>Math.round((outD-inD)/864e5);
  function labels(){
    bIn.textContent=short(inD);bOut.textContent=short(outD);

    book.querySelectorAll('.dt').forEach(f=>f.classList.toggle('active',cal.classList.contains('open')&&f.dataset.p===phase));

  const chev=d=>'<svg viewBox="0 0 24 24"><path d="'+(d<0?'M15 4l-8 8 8 8':'M9 4l8 8-8 8')+'"/></svg>';
  function month(first,i,cnt){
    const ws=L()==='es'?1:0,off=(first.getDay()-ws+7)%7,dim=new Date(first.getFullYear(),first.getMonth()+1,0).getDate();
    let h='<div class="mo"><div class="mh">';

    h+=fmt(first,{month:'long',year:'numeric'});
    if(i===cnt-1)h+='<button type="button" class="nav next" data-nav="1" aria-label="Next month">'+chev(1)+'</button>';
    h+='</div><div class="grid">';
    for(let k=0;k<7;k++)h+='<div class="wd">'+fmt(new Date(2024,0,7+((k+ws)%7)),{weekday:'narrow'})+'</div>';
    for(let k=0;k<off;k++)h+='<button class="d blank" disabled></button>';
    for(let d=1;d<=dim;d++){
      const D=noon(new Date(first.getFullYear(),first.getMonth(),d)),t=+D;

    const nn=nights();

  book.querySelectorAll('.dt').forEach(f=>f.addEventListener('click',e=>{e.stopPropagation();open(f.dataset.p)}));
  cal.addEventListener('click',e=>{
    e.stopPropagation();
    const nav=e.target.closest('[data-nav]');

    const b=e.target.closest('.d[data-t]');if(!b)return;

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.2});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
document.querySelectorAll('.rooms .reveal,.amen .reveal,.qgrid .reveal').forEach((el,i)=>el.style.transitionDelay=(i%4)*.1+'s');
</script>
</body>
</html>
