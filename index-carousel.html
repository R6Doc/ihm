<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>International House Medellín — Co-Living</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="description" content="The first co-living in Medellín. 20 private rooms, dedicated fiber for reliable remote work, rooftop kitchen and a 360° view of the city.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syncopate:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--gold:#c8a74f;--main:#ff1100;--header:72px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,Helvetica,Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* Header */
header{position:fixed;inset:0 0 auto 0;height:var(--header);background:#fff;z-index:50;border-top:4px solid #111;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 clamp(20px,8vw,120px)}
.burger{width:28px;height:20px;display:flex;flex-direction:column;justify-content:center;gap:6px;background:none;border:0;cursor:pointer}
.burger span{display:block;height:2px;background:#111;transition:.3s}
.logo img{height:44px;width:auto;margin:0 auto}
.hright{justify-self:end;display:flex;gap:26px;align-items:center}
.lang{display:flex;gap:2px;font-size:13px;font-weight:600;letter-spacing:.08em}
.lang button{background:none;border:0;font:inherit;cursor:pointer;color:#999;padding:6px 7px;border-radius:4px}
.lang button.on{color:#111}
.hright svg{width:22px;height:22px;fill:#111}

/* Menu */
.menu{position:fixed;inset:0;background:#fff;z-index:40;display:flex;flex-direction:column;justify-content:center;
  padding:0 clamp(24px,10vw,160px);transform:translateY(-100%);transition:transform .6s cubic-bezier(.7,0,.2,1)}
.menu.open{transform:none}
.menu a{font-size:clamp(34px,6vw,76px);font-weight:600;letter-spacing:-.02em;line-height:1.25;transition:.2s}
.menu a:hover{color:var(--gold);padding-left:12px}
.menu small{margin-top:40px;font-size:13px;letter-spacing:.14em;color:#777}
body.lock{overflow:hidden}

/* Hero carousel */
.hero{position:relative;height:100vh;min-height:620px;overflow:hidden;color:#fff;text-align:center;background:#222;padding-top:var(--header)}
.slide{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity 1.2s ease,visibility 1.2s}
.slide.on{opacity:1;visibility:visible}
.slide::before{content:"";position:absolute;inset:0;background:var(--img) center/cover;transform:scale(1.1);transition:transform 8s linear}
.slide.on::before{transform:scale(1)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(8,10,24,.8) 0%,rgba(8,10,24,.48) 45%,rgba(8,10,24,.28) 100%)}
.slide .copy{position:relative;z-index:2;padding:0 24px 17vh;max-width:1100px;opacity:0;transform:translateY(30px);transition:1s .5s;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.slide.on .copy{opacity:1;transform:none}
.eyebrow{font-family:Syncopate,sans-serif;font-size:clamp(11px,1.15vw,15px);letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px}
.hero h1,.hero h2{font-size:clamp(42px,8.2vw,128px);font-weight:700;letter-spacing:-.04em;line-height:1}
.sub{margin:18px auto 0;max-width:620px;font-size:clamp(15px,1.4vw,19px);line-height:1.5}
.pill{display:inline-block;margin-top:34px;padding:19px 44px;border-radius:999px;background:rgba(255,255,255,.22);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:600;font-size:18px;transition:.25s;text-shadow:none}
.pill:hover{background:#fff;color:#111}
.arrow{position:absolute;top:50%;z-index:5;width:56px;height:56px;margin-top:-28px;border-radius:50%;border:0;cursor:pointer;
  background:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;transition:.25s}
.arrow:hover{background:rgba(255,255,255,.38)}
.arrow svg{width:22px;height:22px}
.arrow.prev{left:clamp(14px,3vw,48px)}.arrow.next{right:clamp(14px,3vw,48px)}
.bars{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:10px}
.bars i{display:block;width:clamp(36px,6vw,64px);height:3px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden;cursor:pointer;position:relative;padding:8px 0;background-clip:content-box}
.bars i::after{content:"";position:absolute;left:0;right:0;top:8px;height:3px;background:#fff;transform:scaleX(0);transform-origin:left}
.bars i.done::after{transform:scaleX(1)}
.bars i.on::after{animation:fill var(--dur,6s) linear forwards}
.hero.paused .bars i.on::after{animation-play-state:paused}
@keyframes fill{to{transform:scaleX(1)}}
.chev{position:absolute;bottom:62px;left:50%;margin-left:-13px;z-index:5;width:26px;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(8px)}}


.room .ph.vid{position:relative;cursor:pointer;background:#222}
.room .ph.vid video{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s}
.room:hover .ph.vid video{transform:scale(1.07)}
.room .ph.vid .xp{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;transition:.25s;border:0;cursor:pointer}
.room .ph.vid:hover .xp{background:var(--main)}
.xp svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,10,24,.92);display:none;align-items:center;justify-content:center;padding:24px}
.lb.open{display:flex;animation:pop .25s ease}
.lb video{height:min(88vh,900px);width:auto;max-width:100%;aspect-ratio:474/850;object-fit:contain;border-radius:10px;box-shadow:0 30px 90px rgba(0,0,0,.6);cursor:pointer;background:#000}
.lb .x{position:absolute;top:20px;right:24px;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:26px;line-height:1;cursor:pointer;transition:.2s}
.lb .x:hover{background:var(--main)}

/* Light sections */
.light{padding:clamp(80px,12vw,180px) clamp(20px,8vw,120px);background:#fff}
.light.alt{background:#f6f5f2}
.wrap{max-width:1240px;margin:0 auto}
.kicker{font-family:Syncopate,sans-serif;font-size:12px;letter-spacing:.22em;color:var(--main);text-transform:uppercase;margin-bottom:22px}
.big{font-size:clamp(34px,5vw,72px);font-weight:700;letter-spacing:-.035em;line-height:1.05;max-width:900px}
.lead{margin-top:28px;font-size:clamp(16px,1.5vw,20px);line-height:1.65;color:#444;max-width:720px}
.reveal{opacity:0;transform:translateY(34px);transition:.9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#ddd;margin-top:80px;border:1px solid #ddd}
.stat{background:#fff;padding:40px 28px}
.stat b{display:block;font-size:clamp(36px,4.4vw,64px);letter-spacing:-.04em;font-weight:700}
.stat span{font-size:14px;color:#666;letter-spacing:.04em}
.rooms{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-top:70px}
.room{background:#fff;border-radius:6px;overflow:hidden}
.room .ph{aspect-ratio:4/3;overflow:hidden}
.room .ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.room:hover .ph img{transform:scale(1.07)}
.room .in{padding:22px}
.room h3{font-size:18px;letter-spacing:-.01em}
.room .price{margin-top:14px;font-size:26px;font-weight:700;letter-spacing:-.03em}
.room .price small{font-size:13px;font-weight:500;color:#777;letter-spacing:0}
.room p{margin-top:10px;font-size:14px;color:#666;line-height:1.5}
.room .tag{margin-top:8px;font-size:14px;color:#666;line-height:1.45}
.room .price.ask{font-size:18px;font-weight:600;letter-spacing:-.01em;color:var(--main)}
.nightly{margin-top:36px;padding:28px 32px;border:1px solid #ddd;border-radius:6px;display:flex;gap:40px;flex-wrap:wrap;background:#fff}
.nightly div{font-size:15px;color:#555}.nightly b{display:block;font-size:22px;color:#111;margin-top:4px}
.amen{display:grid;grid-template-columns:repeat(3,1fr);margin-top:70px;border-top:1px solid #ddd}
.amen div{padding:34px 30px 34px 0;border-bottom:1px solid #ddd;font-size:17px;line-height:1.5}
.amen .ic{width:50px;height:50px;border-radius:50%;background:rgba(255,17,0,.08);display:grid;place-items:center;color:var(--main);margin-bottom:18px;transition:.3s}
.amen .ic svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.amen div:hover .ic{background:var(--main);color:#fff;transform:translateY(-3px)}
.amen b{display:block;font-size:12px;letter-spacing:.2em;color:var(--main);margin-bottom:10px;font-family:Syncopate,sans-serif}
.quotes{background:#111;color:#fff}
.quotes .kicker{color:var(--gold)}
.quotes .grate{margin-top:22px;font-size:15px;color:#bbb;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.quotes .grate b{color:#fff;font-size:22px;letter-spacing:-.02em}
.stars{color:var(--gold);letter-spacing:3px;font-size:17px;display:block;margin-bottom:14px}
.grate .stars{display:inline;margin:0}
.qgrid blockquote .qt{display:block}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:48px;margin-top:70px}
.qgrid blockquote{font-size:clamp(16px,1.35vw,19px);line-height:1.65;color:#ddd}
.qgrid cite{display:block;margin-top:22px;font-style:normal;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.contact{display:grid;grid-template-columns:1.1fr 1fr;gap:60px;align-items:center}
.contact img{border-radius:6px;aspect-ratio:4/3;object-fit:cover;width:100%}
.btn{display:inline-block;margin-top:34px;padding:19px 44px;border-radius:999px;background:#111;color:#fff;font-weight:600;font-size:17px;transition:.25s}
.btn:hover{background:var(--main)}
.btn.ghost{background:none;color:#111;border:1px solid #111;margin-left:12px}
.btn.ghost:hover{background:#111;color:#fff}
footer{padding:50px clamp(20px,8vw,120px);border-top:1px solid #e5e5e5;display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px;font-size:13px;color:#777}

@media (max-width:1100px){.rooms{grid-template-columns:repeat(3,1fr)}}
@media (max-width:980px){.stats,.rooms,.amen,.qgrid{grid-template-columns:1fr 1fr}.contact{grid-template-columns:1fr}}
@media (max-width:700px){.arrow,.chev{display:none}}
@media (max-width:600px){.stats,.rooms,.amen,.qgrid{grid-template-columns:1fr}.btn.ghost{margin:14px 0 0}.hright{gap:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <button class="burger" id="burger" aria-label="Menu"><span></span><span></span></button>
  <a class="logo" href="#top"><img src="img/logo-ih.png" alt="International House Medellín"></a>
  <div class="hright">
    <div class="lang"><button data-lang="en">EN</button><button data-lang="es">ES</button></div>
    <a href="#contact" aria-label="Location"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.500A2.500 2.500 0 1 1 12 6.500a2.500 2.500 0 0 1 0 5z"/></svg></a>
    <a href="https://wa.me/573012114380" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M20 3.900A10 10 0 0 0 3.600 16.100L2 22l6-1.600A10 10 0 1 0 20 3.900zM12 20.200a8.200 8.200 0 0 1-4.200-1.200l-.3-.2-3.500.9.900-3.400-.2-.3A8.200 8.200 0 1 1 12 20.200zm4.500-6.100c-.2-.1-1.500-.7-1.700-.8s-.4-.1-.6.100-.6.800-.8 1-.3.200-.6.100a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.200-.4.700-1.300a.5.5 0 0 0 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.300 3 3 0 0 0-.9 2.200 5.200 5.200 0 0 0 1.100 2.800 11.900 11.900 0 0 0 4.600 4c1.700.7 2.300.8 3.200.7a2.700 2.700 0 0 0 1.800-1.300 2.200 2.200 0 0 0 .2-1.300c-.1-.1-.3-.2-.5-.3z"/></svg></a>
  </div>
</header>

<nav class="menu" id="menu">
  <a href="#top" data-i18n="m1"></a>
  <a href="#rooms" data-i18n="m2"></a>
  <a href="#amenities" data-i18n="m3"></a>
  <a href="#about" data-i18n="m4"></a>
  <a href="#contact" data-i18n="m5"></a>
  <small>CALLE 32B #66C-06 · BELÉN ROSALES · MEDELLÍN</small>
</nav>

<!-- Hero carousel -->
<section class="hero" id="top">
  <div class="slides">
    <div class="slide on" style="--img:url(img/5s-scaled-1.jpg)"><div class="copy">
      <div class="eyebrow" data-i18n="s1e"></div><h1 data-i18n="s1t"></h1><p class="sub" data-i18n="s1p"></p>
      <a class="pill" href="#rooms" data-i18n="more"></a></div></div>
    <div class="slide" style="--img:url(img/RoofTop-2s-scaled-1.jpg)"><div class="copy">
      <div class="eyebrow" data-i18n="s2e"></div><h2 data-i18n="s2t"></h2><p class="sub" data-i18n="s2p"></p>
      <a class="pill" href="#amenities" data-i18n="more"></a></div></div>
    <div class="slide" style="--img:url(img/Kitchen-1s-scaled-1.jpg)"><div class="copy">
      <div class="eyebrow" data-i18n="s3e"></div><h2 data-i18n="s3t"></h2><p class="sub" data-i18n="s3p"></p>
      <a class="pill" href="#about" data-i18n="more"></a></div></div>
    <div class="slide" style="--img:url(img/best-hostel-in-medellin-2-1.jpg)"><div class="copy">
      <div class="eyebrow" data-i18n="s4e"></div><h2 data-i18n="s4t"></h2><p class="sub" data-i18n="s4p"></p>
      <a class="pill" href="#contact" data-i18n="s4b"></a></div></div>
  </div>
  <button class="arrow prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M15 4l-8 8 8 8"/></svg></button>
  <button class="arrow next" aria-label="Next"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M9 4l8 8-8 8"/></svg></button>
  <div class="bars" id="bars"><i></i><i></i><i></i><i></i></div>
  <a class="chev" href="#about" aria-label="Scroll"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M4 8l8 8 8-8"/></svg></a>
</section>

<!-- About -->
<section class="light" id="about">
  <div class="wrap">
    <div class="kicker reveal" data-i18n="a_k"></div>
    <h2 class="big reveal" data-i18n="a_h"></h2>
    <p class="lead reveal" data-i18n="a_p"></p>
    <div class="stats reveal">
      <div class="stat"><b>20</b><span data-i18n="st1"></span></div>
      <div class="stat"><b>Fiber</b><span data-i18n="st2"></span></div>
      <div class="stat"><b>360°</b><span data-i18n="st3"></span></div>
      <div class="stat"><b>50</b><span data-i18n="st4"></span></div>
    </div>
  </div>
</section>

<!-- Rooms -->
<section class="light alt" id="rooms">
  <div class="wrap">
    <div class="kicker reveal" data-i18n="r_k"></div>
    <h2 class="big reveal" data-i18n="r_h"></h2>
    <p class="lead reveal" data-i18n="r_p"></p>
    <div class="rooms">
      <article class="room reveal"><div class="ph"><img src="img/room-12.jpg" alt="" loading="lazy"></div>
        <div class="in"><h3 data-i18n="rm1"></h3><div class="tag" data-i18n="rm1p"></div></div></article>
      <article class="room reveal"><div class="ph"><img src="img/room-10.jpg" alt="" loading="lazy"></div>
        <div class="in"><h3 data-i18n="rm2"></h3><div class="tag" data-i18n="rm2p"></div></div></article>
      <article class="room reveal"><div class="ph"><img src="img/room-20.jpg" alt="" loading="lazy"></div>
        <div class="in"><h3 data-i18n="rm4"></h3><div class="tag" data-i18n="rm4p"></div></div></article>
      <article class="room reveal"><div class="ph"><img src="img/room-22.jpg" alt="" loading="lazy"></div>
        <div class="in"><h3 data-i18n="rm3"></h3><div class="tag" data-i18n="rm3p"></div></div></article>
      <article class="room reveal"><div class="ph vid" id="studioVid" role="button" tabindex="0" aria-label="Expand video"><video src="vid/studio.mp4" muted loop playsinline preload="metadata" disablepictureinpicture></video><span class="xp"><svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg></span></div>
        <div class="in"><h3 data-i18n="rm5"></h3><div class="tag" data-i18n="rm5p"></div></div></article>
    </div>
  </div>
</section>

<!-- Amenities -->
<section class="light" id="amenities">
  <div class="wrap">
    <div class="kicker reveal" data-i18n="am_k"></div>
    <h2 class="big reveal" data-i18n="am_h"></h2>
    <div class="amen">
      <div class="reveal"><i class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4v16"/><path d="M2 8h18a2 2 0 0 1 2 2v10"/><path d="M2 17h20"/><path d="M6 8v9"/></svg></i><span data-i18n="am1"></span></div>
      <div class="reveal"><i class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></svg></i><span data-i18n="am2"></span></div>
      <div class="reveal"><i class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z"/><path d="M6 17h12"/></svg></i><span data-i18n="am3"></span></div>
      <div class="reveal"><i class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></i><span data-i18n="am4"></span></div>

      <div class="reveal"><i class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></i><span data-i18n="am7"></span></div>
      <div class="reveal"><i class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg></i><span data-i18n="am8"></span></div>
    </div>
  </div>
</section>

<!-- Testimonials -->
<section class="light quotes" id="testimonials">
  <div class="wrap">
    <div class="kicker reveal" data-i18n="t_k"></div>
    <h2 class="big reveal" data-i18n="t_h"></h2>
    <p class="grate reveal"><span class="stars">★</span><b>4.81</b><span data-i18n="gr"></span></p>
    <div class="qgrid">

function toggle(open){menu.classList.toggle('open',open);document.body.classList.toggle('lock',open);
  const s=burger.querySelectorAll('span');
  s[0].style.transform=open?'translateY(4px) rotate(45deg)':'';s[1].style.transform=open?'translateY(-4px) rotate(-45deg)':'';}
burger.onclick=()=>toggle(!menu.classList.contains('open'));

// carousel
(function(){
  const hero=document.querySelector('.hero'),slides=[...hero.querySelectorAll('.slide')],bars=[...hero.querySelectorAll('.bars i')];
  const DUR=6000;let cur=0,timer;
  hero.style.setProperty('--dur',DUR+'ms');
  function go(n){
    cur=(n+slides.length)%slides.length;
    slides.forEach((s,i)=>s.classList.toggle('on',i===cur));
    bars.forEach((b,i)=>{b.classList.remove('on','done');void b.offsetWidth;if(i<cur)b.classList.add('done');if(i===cur)b.classList.add('on')});
    clearTimeout(timer);timer=setTimeout(()=>go(cur+1),DUR);
    hero.classList.remove('paused');
  }
  hero.querySelector('.next').onclick=()=>go(cur+1);
  hero.querySelector('.prev').onclick=()=>go(cur-1);
  bars.forEach((b,i)=>b.onclick=()=>go(i));
  // swipe
  let x0=null;
  hero.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
  hero.addEventListener('touchend',e=>{if(x0===null)return;const d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)go(cur+(d<0?1:-1));x0=null});
  // keyboard
  addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
  // pause when off-screen
  new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){go(cur)}else{clearTimeout(timer)}})},{threshold:.3}).observe(hero);
})();


// studio video: autoplay muted in card when visible, click to expand
(function(){
  const box=document.getElementById('studioVid');if(!box)return;
  const cv=box.querySelector('video'),lb=document.getElementById('lb'),lv=document.getElementById('lbv');
  new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){cv.play().catch(()=>{})}else cv.pause()}),{threshold:.4}).observe(box);
  function open(){lb.classList.add('open');lb.setAttribute('aria-hidden','false');document.body.classList.add('lock');cv.pause();lv.play().catch(()=>{})}
  function close(){lb.classList.remove('open');lb.setAttribute('aria-hidden','true');document.body.classList.remove('lock');lv.pause();cv.play().catch(()=>{})}
  box.addEventListener('click',open);
  box.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
  document.getElementById('lbx').onclick=close;
  lb.addEventListener('click',e=>{if(e.target===lb)close()});
  lv.addEventListener('click',()=>lv.paused?lv.play():lv.pause());
  addEventListener('keydown',e=>{if(e.key==='Escape'&&lb.classList.contains('open'))close()});
})();

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.2});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
document.querySelectorAll('.rooms .reveal,.amen .reveal,.qgrid .reveal').forEach((el,i)=>el.style.transitionDelay=(i%4)*.1+'s');
